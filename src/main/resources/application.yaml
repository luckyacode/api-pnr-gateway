spring:
  application:
    name: api-pnr-gateway
  threads:
    virtual:
      enabled: true # Enable Java 21 Virtual Threads natively
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:pnr_db}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:pnr_db}

  ###----Exactly One Delivery Semantics
  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:9092

    # === CONSUMER CONFIGURATION ===
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      group-id: skyflying-eos-group # Make sure this is present
      isolation-level: read_committed
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.praveen.skyflying"
        spring.json.value.default.type: "com.praveen.skyflying.dto.Invoice"

    # === PRODUCER CONFIGURATION ===
    producer:
      acks: all
      # 👇 FIX 1 & 2: Renamed to standard Spring Boot format and fixed alignment
      transaction-id: tx-invoice-
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    # === LISTENER CONFIGURATION ===
    listener:
      ack-mode: RECORD
    #----Exactly One Delivery Semantics
management:
  endpoints:
    web:
      exposure:
        include: "health,liveness,readiness,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: api-pnr-gateway
server:
  port: ${SERVER_PORT:8080}