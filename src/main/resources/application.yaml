spring:
  application:
    name: api-pnr-gateway
  threads:
    virtual:
      enabled: true # Enable Java 21 Virtual Threads natively
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    url: jdbc:postgresql://${db-host:localhost}:${DB_PORT:5432}/${postgres-db:pnr_db}
    driver-class-name: org.postgresql.Driver
    username: ${postgres-user:root}
    password: ${postgres-password:pnr_db}
    hikari:
      maximum-pool-size: 4

  ###----Exactly One Delivery Semantics
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:kafka-service:29092}

    consumer:
      isolation-level: read_committed
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

      # 🌟 FIXED: Expanded dot-notation properties into fully nested YAML structure
      properties:
        spring:
          deserializer:
            value:
              delegate:
                class: org.springframework.kafka.support.serializer.JsonDeserializer
          json:
            trusted:
              packages: "*"

    producer:
      acks: all
      transaction-id: tx-dcs-request-event.avsc-booking-
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    template:
      observation-enabled: true
    listener:
      ack-mode: MANUAL_IMMEDIATE
      observation-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: "health,liveness,readiness,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: api-pnr-gateway

server:
  port: ${SERVER_PORT:8083}

logging:
  pattern:
    correlation: "[%X{traceId:-},%X{spanId:-}]"