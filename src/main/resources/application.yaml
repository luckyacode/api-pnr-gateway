spring:
  application:
    name: api-pnr-gateway
  threads:
    virtual:
      enabled: true # Enable Java 21 Virtual Threads natively
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    url: jdbc:postgresql://${db-host:localhost}:${DB_PORT:5432}/${postgres-db:pnr_db}
    driver-class-name: org.postgresql.Driver
    username: ${postgres-user:root}
    password: ${postgres-password:pnr_db}

  ###----Exactly One Delivery Semantics
  kafka:
    bootstrap-servers: ${kafka-host:localhost}:${kafka-port:9092}
    template:
      observation-enabled: true

    # === CONSUMER CONFIGURATION ===
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      group-id: skyflying-eos-group # Make sure this is present
      isolation-level: read_committed
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
#      properties:
#        spring.json.trusted.packages: "com.praveen.*"
#        spring.json.value.default.type: "com.praveen.apipnrgateway.dto.PNRRequest"

    # === PRODUCER CONFIGURATION ===
    producer:
      acks: all
      # 👇 FIX 1 & 2: Renamed to standard Spring Boot format and fixed alignment
      transaction-id: tx-invoice-
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

    # === LISTENER CONFIGURATION ===
    listener:
      ack-mode: RECORD
      observation-enabled: true
    #----Exactly One Delivery Semantics
management:
  endpoints:
    web:
      exposure:
        include: "health,liveness,readiness,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: api-pnr-gateway
server:
  port: ${SERVER_PORT:8087}
logging:
  pattern:
    correlation: "[%X{traceId:-},%X{spanId:-}]"
