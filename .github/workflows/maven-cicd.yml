name: Spring Boot CI/CD Pipeline

on:
  push:
    branches: [ "devonly-specific" ]
  pull_request:
    branches: [ "devonly-specific" ]

permissions:
  contents: read
  packages: write

jobs:

  # --- STAGE 1: BUILD & PUSH DOCKER IMAGE TO GHCR ---
  build-and-ship:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/devonly-specific' && github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 🌟 STEP 1: Set up Docker Buildx (Required for advanced caching features)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3




      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 🌟 Fixed: Point target directly to repository root package path
      - name: Extract Metadata (Tagging)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short


      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max




  # --- STAGE 3: AUTOMATED DEPLOY TO ORACLE CLOUD ---
  deploy-to-oci:
    needs: build-and-ship
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/devonly-specific' && github.event_name == 'push'

    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Successfully connected to Oracle Cloud Instance!"
            
            # 🌟 Fixed: Strip out the /appthree suffix so the string maps precisely to simulator path
            REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            IMAGE_URI="ghcr.io/${REPO_LOWER}:latest"
            
            echo "Targeting Image Registry: ${IMAGE_URI}"
            
            # 1. Pull the newly baked image down from GitHub Packages
            
            sudo docker pull ${IMAGE_URI}
            
            # 2. Stop and remove the old running container if it exists
            sudo docker stop pnr-gateway-container || true
            sudo docker rm pnr-gateway-container || true
            
            # 3. Spin up the new container mapped to server port 8080
              sudo docker run -d \
              --name api-pnr-gateway-container \
              --network praveen_default \
              -p 8087:8087 \
              -e SPRING_PROFILES_ACTIVE=docker \
              --restart always \
              ${IMAGE_URI}
            
            # 4. Clean up dangling old images to save free tier storage
            sudo docker image prune -f
            
            
            echo "Deployment completed successfully! Running containers:"
            sudo docker ps